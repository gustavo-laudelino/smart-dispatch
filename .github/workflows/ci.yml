name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: smart_dispatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/smart_dispatch_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: c21hcnQtZGlzcGF0Y2gtY2ktc2VjcmV0LTEyMzQ1Njc4
      TEST_DB_URL: jdbc:postgresql://localhost:5432/smart_dispatch_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      TEST_JWT_SECRET: c21hcnQtZGlzcGF0Y2gtdGVzdC1zZWNyZXQtMTIzNDU2Nzg=
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn --batch-mode test

  frontend:
    name: Frontend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
