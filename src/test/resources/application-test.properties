# Profile de testes de integração — nunca reaproveita as variáveis da aplicação
# normal (DB_URL/DB_USERNAME/DB_PASSWORD/JWT_SECRET). Usa exclusivamente as
# variáveis TEST_*, com defaults locais apontando para smart_dispatch_test.
# Isso evita que ddl-auto=create-drop atinja o banco normal caso as variáveis
# da aplicação estejam carregadas no ambiente.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/smart_dispatch_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${TEST_JWT_SECRET:c21hcnQtZGlzcGF0Y2gtdGVzdC1zZWNyZXQtMTIzNDU2Nzg=}
app.jwt.expiration-seconds=43200

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
